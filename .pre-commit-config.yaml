# Single source of truth for lint/format/secret-scan tool versions (local hooks + CI).
# Install once: pipx install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  # Scans *staged* changes only (gitleaks git --staged); CI adds a --no-git tree scan
  # with the same pinned version.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  # The router-side code is POSIX shell (busybox ash); no-op until .sh / shebang files exist.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # Workflow lint: actionlint (syntax/expressions/shellcheck of run steps) and zizmor
  # (workflow security audit). Both run in the CI pre-commit job.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # Online audits (impostor commits, ref confusion) need a GitHub token; keep the hook
        # deterministic and token-free.
        args: [--no-online-audits]
