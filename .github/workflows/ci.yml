name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # PRs share a group per ref (superseded runs are cancelled); every push gets its own group,
  # because a shared group would still cancel an older *pending* run on main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Pinned like every other tool; bump together with a .pre-commit-config.yaml review.
      - run: pip install "pre-commit==4.6.2"
      - run: pre-commit run --all-files --show-diff-on-failure
      # The gitleaks hook only scans staged changes, so it is a no-op under
      # --all-files. Scan the working tree with the same pinned version.
      - name: gitleaks (working tree)
        # Bump GITLEAKS_VERSION and GITLEAKS_SHA256 by hand together with the gitleaks hook rev in
        # .pre-commit-config.yaml; Dependabot cannot update this tarball pin.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks dir "${GITHUB_WORKSPACE}" --redact --verbose
